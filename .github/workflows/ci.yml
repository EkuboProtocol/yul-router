name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: yul-router
          submodules: recursive

      - parallel:
          - name: Install Foundry
            uses: foundry-rs/foundry-toolchain@v1
            with:
              version: stable

          - name: Setup Bun
            uses: oven-sh/setup-bun@v2
            with:
              bun-version: 1.3.11

      # The contract build is the longest step and does not read anything the
      # SDK steps produce, so it runs in the background while they run in order.
      # The forge consumers below wait for it explicitly.
      - name: Build contracts and scripts
        id: build-contracts
        run: forge build
        working-directory: yul-router
        background: true

      - name: Install SDK dependencies
        run: bun install --frozen-lockfile
        working-directory: yul-router/sdk

      - name: Lint SDK
        run: bun run lint
        working-directory: yul-router/sdk

      - name: Build SDK
        run: bun run build
        working-directory: yul-router/sdk

      - name: Test SDK
        run: bun run test
        working-directory: yul-router/sdk

      - name: Test release helpers
        run: |
          bash -n script/release/deploy-router.sh
          node --test script/release/release.test.mjs
        working-directory: yul-router

      # Packs the SDK exactly as the release workflow does and checks that the
      # artifact on this revision still targets the router recorded for the
      # version in sdk/package.json.
      - name: Verify packed SDK targets the recorded deployments
        run: |
          pack_dir="$(mktemp -d)"
          tarball="$(npm pack --json --pack-destination "$pack_dir" | jq -r '.[0].filename')"
          node ../script/release/verify-packed-package.mjs \
            "$(jq -r .version package.json)" \
            "$pack_dir/$tarball"
        working-directory: yul-router/sdk

      - name: Wait for the contract build
        wait: build-contracts

      - name: Simulate deploy script
        run: forge script script/DeployYulRouter.s.sol --sig "run()" --offline
        working-directory: yul-router

      - name: Test contracts
        run: forge test
        working-directory: yul-router

  production-quotes:
    name: Production Quote Integration
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: yul-router
          submodules: recursive

      - parallel:
          - name: Install Foundry
            uses: foundry-rs/foundry-toolchain@v1
            with:
              version: stable

          - name: Setup Bun
            uses: oven-sh/setup-bun@v2
            with:
              bun-version: 1.3.11

      # The integration script shells out to bun, so both the SDK dependencies
      # and the contract build must be complete before it runs.
      - parallel:
          - name: Install SDK dependencies
            run: bun install --frozen-lockfile
            working-directory: yul-router/sdk

          - name: Build contracts and integration script
            run: forge build
            working-directory: yul-router

      - name: Execute production quotes on a mainnet fork
        run: forge script script/ProductionQuotesIntegration.s.sol -vvv
        working-directory: yul-router
